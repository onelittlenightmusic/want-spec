openapi: 3.0.3
info:
  title: MyWant Want Type Definition Schema
  description: OpenAPI specification for MyWant want type YAML definition files
  version: 1.0.0
  contact:
    name: MyWant
    url: https://github.com/onelittlenightmusic/MyWant

paths: {}

components:
  schemas:
    # Root want type wrapper
    WantTypeWrapper:
      type: object
      description: Root wrapper for want type definition
      required:
        - wantType
      properties:
        wantType:
          $ref: '#/components/schemas/WantTypeDefinition'
      additionalProperties: false

    # Complete want type definition
    WantTypeDefinition:
      type: object
      description: Complete want type definition
      required:
        - metadata
      properties:
        metadata:
          $ref: '#/components/schemas/WantTypeMetadata'
        parameters:
          type: array
          description: Parameter definitions for want configuration
          items:
            $ref: '#/components/schemas/ParameterDef'
          default: []
        state:
          type: array
          description: State field definitions
          items:
            $ref: '#/components/schemas/StateDef'
          default: []
        connectivity:
          $ref: '#/components/schemas/ConnectivityDef'
        connect:
          description: Connectivity requirement specification
          allOf:
            - $ref: '#/components/schemas/RequireSpec'
        require:
          description: Structured connectivity requirement (deprecated, use connect)
          allOf:
            - $ref: '#/components/schemas/RequireSpec'
        usageLimit:
          description: Deprecated, use connect instead
          allOf:
            - $ref: '#/components/schemas/UsageLimitSpec'
        requires:
          type: array
          description: Agent capability requirements including ThinkAgent capabilities (must be at wantType level)
          items:
            type: string
          default: []
        monitorCapabilities:
          type: array
          description: MonitorAgent capabilities provided by this want type
          items:
            $ref: '#/components/schemas/MonitorCapabilityDef'
          default: []
        capabilities:
          type: array
          description: |
            What a want of this type can answer, beyond its own result — each
            said in words for the robot to choose by, and how it is done: a
            prompt over data the server hands it (reads), or a Machine-Readable
            Skill of the type's own. Not an agent's capability (requires,
            monitorCapabilities): those are what a want needs; these are what
            it offers.
          items:
            $ref: '#/components/schemas/WantCapabilityDef'
          default: []
        finalResultField:
          type: string
          description: Default state key for final_result
        timings:
          type: array
          description: |
            The moments of the type's answer worth telling of. The want says one
            came from its Progress (Want.Timing("name"); a plugin script prints
            {"_timing": "name"}); one with `if`, `onChange`, `onIncrease` or
            `onDecrease` is also read off every answer kept to its history
            (those given all hold). A want chooses which
            it murmurs at (its tile's "!", labels `murmur`) and which it
            notifies at (a push, label `notify`) — a comma list of names, or
            `none`. With no label, a timing's own murmur / notify say.
          items:
            type: object
            required: [name]
            properties:
              name: {type: string}
              description: {type: string}
              icon:
                type: string
                description: The moment's glyph, a lucide icon name (as a type's type-icon label); none — a clock.
              if:
                type: string
                description: A field (result or state) that must be truthy; none — always.
              onChange:
                type: string
                description: A field that must differ from its value at the last answer; none — every answer.
              onIncrease:
                type: string
                description: A field that must have grown since the last answer — a number, or a list's length (an item added).
              onDecrease:
                type: string
                description: A field that must have shrunk since the last answer — a number, or a list's length (an item gone).
              murmur: {type: boolean, default: false}
              notify: {type: boolean, default: false}
              irregular:
                type: boolean
                default: false
                description: |
                  The moment is out of the ordinary — a train late, a reservation
                  changed or taken away, a backup failed — not the answer coming
                  round as it does. What is routine a want that hears it answers;
                  an irregular moment is the robot's to look at and propose about.
              requires:
                type: array
                items: {type: string}
                description: |
                  What the moment needs done — reschedule (the time planned
                  again), notify (the person told), rebook (taken again), retry
                  (done again), or a word of the type's own. Met by a capability
                  that attends to it, of whatever type: the moment names no type.
                example: [reschedule, notify]
        globalOverrideFrom:
          type: string
          description: |
            Name of a global parameter whose value is written into this want's state
            on initialization, overriding any local default.
        agents:
          type: array
          description: Agent definitions
          items:
            $ref: '#/components/schemas/AgentDef'
          default: []
        inlineAgents:
          type: array
          description: Inline agent definitions with embedded scripts
          items:
            $ref: '#/components/schemas/InlineAgentDef'
          default: []
        asks:
          type: array
          description: |
            How a person asks for a want of this type, in words, and the
            parameters it is to be made with (AskDef) — what reads requests
            learns from and is tested on.
          items:
            $ref: '#/components/schemas/AskDef'
        hearing:
          type: object
          description: |
            What a want of this type does with a murmur it heard (spec.hear),
            told to the person choosing what it hears. Without it, the want
            answers in a word.
          properties:
            kind:
              type: string
              enum: [say, propose, act]
              description: |
                say — a word back; propose — proposes things, done only on the
                person's yes; act — acts at once, unasked, only on itself.
            description:
              type: string
              description: What it does, said as an action (「盤面で花火を上げる」).
        requestAsNew:
          type: boolean
          description: |
            A restart of a want of this type is a new request: what it had
            answered belongs to the request before, so it is not achieved again
            until it answers this one. Starting the server again is not a
            request.
          default: false
        finalizeWhen:
          description: Declarative termination conditions grouping achieved and failed outcomes.
          allOf:
            - $ref: '#/components/schemas/FinalizeWhen'
        achievedWhen:
          description: "Deprecated: use finalizeWhen.achieved instead."
          allOf:
            - $ref: '#/components/schemas/ConditionDef'
        onInitialize:
          description: Actions to execute when the want is initialized
          allOf:
            - $ref: '#/components/schemas/LifecycleHookDef'
        onDelete:
          description: Actions to execute when the want is deleted
          allOf:
            - $ref: '#/components/schemas/LifecycleHookDef'
        onAchieved:
          description: Actions to execute when the want reaches the achieved state
          allOf:
            - $ref: '#/components/schemas/LifecycleHookDef'
        constraints:
          type: array
          description: Business logic constraints
          items:
            $ref: '#/components/schemas/ConstraintDef'
          default: []
        examples:
          type: array
          description: Usage examples
          items:
            $ref: '#/components/schemas/ExampleDef'
          default: []
        relatedTypes:
          type: array
          description: Related want type names
          items:
            type: string
          default: []
        seeAlso:
          type: array
          description: Documentation references
          items:
            type: string
          default: []
        goType:
          type: string
          description: |
            Fully-qualified Go type name that implements this want type's engine logic.
            Used by the engine to instantiate the correct struct at runtime.
          example: "mywant.QueueWant"
      additionalProperties: false

    # Want type metadata
    WantTypeMetadata:
      type: object
      description: Want type identity and classification
      required:
        - name
        - title
        - description
        - version
        - category
        - pattern
      properties:
        name:
          type: string
          description: Unique want type name
          pattern: '^[a-z][a-z0-9_]*$'
        title:
          type: string
          description: Human-readable title
        description:
          type: string
          description: Detailed description
        version:
          type: string
          description: Version string
          pattern: '^\d+\.\d+(\.\d+)?$'
        category:
          type: string
          description: Want type category
        pattern:
          type: string
          description: Want type pattern
          enum:
            - generator
            - processor
            - sink
            - independent
            - coordinator
        system_type:
          type: boolean
          description: If true, hide from user-facing want type selector
          default: false
        labels:
          type: object
          description: Key-value labels for grouping or filtering want types
          additionalProperties:
            type: string
      additionalProperties: false

    # Parameter definition
    ParameterDef:
      type: object
      description: Parameter definition for want configuration
      required:
        - name
        - description
        - type
        - required
      properties:
        name:
          type: string
          description: Parameter name
          pattern: '^[a-z][a-z0-9_]*$'
        title:
          type: string
          description: |
            What the parameter is called on screen, when its name (an ASCII
            identifier) is not what anybody would call it.
        description:
          type: string
          description: Parameter description
        type:
          type: string
          description: Go type (int, float64, string, bool, []string, map[string]any)
        label:
          type: string
          description: |
            UI / semantic label for this parameter (e.g. "goal", "current", "plan", "internal").
          enum: [goal, current, plan, internal]
        default:
          description: Default value
        defaultGlobalParameter:
          type: string
          description: Global parameter key to use as fallback when neither spec.params nor default is set
          pattern: '^[a-z][a-z0-9_]*$'
        defaultGlobalParameterFrom:
          type: string
          description: |
            Like defaultGlobalParameter but the key itself is resolved from another
            global parameter. Useful for indirection (e.g. tenant-specific defaults).
          pattern: '^[a-z][a-z0-9_]*$'
        required:
          type: boolean
          description: Whether parameter is required
        validation:
          $ref: '#/components/schemas/ValidationRules'
        example:
          description: Example value
        context:
          type: string
          enum:
            - place.destination
            - place.origin
            - place.area
            - time.date
            - time.at
            - time.arrive_by
            - time.depart_at
            - time.duration
            - people.party_size
            - people.who
            - interest.topic
            - interest.subject
            - preference.mode
            - preference.budget
            - preference.cuisine
          description: |
            The kind of the person's context (what they are about now, read
            from their last requests) that fills this parameter when a request
            leaves it out — a route's `to` is place.destination. A value said
            always wins. Kinds, by category:
              place       destination (going to), origin (leaving from), area (asking about)
              time        date (YYYY-MM-DD), at (planned HH:MM), arrive_by, depart_at, duration (5m)
              people      party_size (a number), who (with whom)
              interest    topic (what they are doing), subject (a team, event, artist followed)
              preference  mode (walking/cycling/driving/transit), budget, cuisine
        subType:
          type: string
          description: |
            Semantic category of this parameter's value: what a value entered
            here IS, which drives autocomplete and what catalog it is remembered
            in. Examples: station, place, city, date, port.
        accepts:
          type: array
          description: |
            Further categories this parameter takes, without changing what a
            value entered here is recorded as. A route's `from` accepts a
            station, a named place, a coordinate or an address; subType stays
            the one it records under. subType is always accepted and need not
            be repeated. Absent means the parameter takes its subType alone.
          items:
            type: string
        recordThing:
          type: boolean
          description: |
            Whether values entered here are remembered as things. Defaults to
            true when subType is set; set false for secrets.
        recordMemo:
          type: boolean
          deprecated: true
          description: What recordThing was called before things were called things.
        backgroundImage:
          type: string
          description: |
            A picture of what this parameter stands for, drawn behind its card:
            a URL, or a data: URL. A web want's parameters are the objects saved
            on its page, each shown as it looked there.
      additionalProperties: false

    # Validation rules
    ValidationRules:
      type: object
      description: Validation constraints for parameters
      properties:
        min:
          type: number
          description: Minimum value
        max:
          type: number
          description: Maximum value
        pattern:
          type: string
          description: Regex pattern
        enum:
          type: array
          description: Allowed values
          items: {}
      additionalProperties: false

    # State definition
    StateDef:
      type: object
      description: State field definition
      required:
        - name
        - description
        - type
        - persistent
      properties:
        name:
          type: string
          description: State field name
          pattern: '^[a-z][a-z0-9_]*$'
        description:
          type: string
          description: State field description
        type:
          type: string
          description: State field type
        label:
          type: string
          description: State label (goal, current, plan, internal)
          enum: [goal, current, plan, internal]
        persistent:
          type: boolean
          description: Whether state persists across restarts
        initialValue:
          description: Initial value
        example:
          description: Example value
        onFetchData:
          type: string
          description: JSON path to extract from script json_data output (e.g. "routes[0].departure")
        fetchFrom:
          type: string
          description: |
            State key (in another want or global scope) to transparently read the
            value from. Useful for aliasing a remote field into local state.
          example: "global_budget"
      additionalProperties: false

    # Connectivity definition
    ConnectivityDef:
      type: object
      description: Input/output patterns
      properties:
        inputs:
          type: array
          description: Input channel definitions
          items:
            $ref: '#/components/schemas/ChannelDef'
          default: []
        outputs:
          type: array
          description: Output channel definitions
          items:
            $ref: '#/components/schemas/ChannelDef'
          default: []
      additionalProperties: false

    # Channel definition
    ChannelDef:
      type: object
      description: Input or output channel definition
      required:
        - name
        - type
        - description
      properties:
        name:
          type: string
          description: Channel name
        type:
          type: string
          description: Channel type
          enum:
            - want
            - agent
            - state
            - event
        data_type:
          type: string
          description: Optional data type carried by this channel
        description:
          type: string
          description: Channel description
        required:
          type: boolean
          description: Whether channel is required
          default: false
        multiple:
          type: boolean
          description: Whether multiple connections allowed
          default: false
      additionalProperties: false

    # Require spec
    RequireSpec:
      type: object
      description: Structured connectivity requirements
      required:
        - type
      properties:
        type:
          type: string
          description: Connectivity policy
          enum:
            - none
            - users
            - providers
            - providers_and_users
        providers:
          type: array
          description: Input connection specifications
          items:
            $ref: '#/components/schemas/ConnectionSpec'
          default: []
        users:
          type: array
          description: Output connection specifications
          items:
            $ref: '#/components/schemas/ConnectionSpec'
          default: []
      additionalProperties: false

    # Connection spec
    ConnectionSpec:
      type: object
      description: Single connection definition
      required:
        - name
        - type
        - description
        - required
        - multiple
      properties:
        name:
          type: string
          description: Connection name
        type:
          type: string
          description: Connection type
        data_type:
          type: string
          description: Optional data type for this connection
        description:
          type: string
          description: Connection description
        required:
          type: boolean
          description: Whether connection is required
        multiple:
          type: boolean
          description: Whether multiple connections allowed
      additionalProperties: false

    # Usage limit spec (deprecated)
    UsageLimitSpec:
      type: object
      description: Deprecated usage limit specification (use connect instead)
      additionalProperties: true

    # Monitor capability definition
    WantCapabilityDef:
      type: object
      description: |
        One thing a want of this type can answer. The robot chooses it by its
        description; the server does it — gathering only the data named in
        reads and handing it, with the prompt, to the model that words the
        answer, or running the skill named. Nothing else is reached.
      required:
        - name
        - description
      properties:
        name:
          type: string
          description: The capability's name, unique in its type
          example: "latest_score"
        description:
          type: string
          description: What it answers, in the person's words — what the robot chooses it by
          example: "最新のゴルフのスコアを検索できる"
        reads:
          type: array
          description: |
            The data the server gathers for the prompt, by kind: answers (the
            want's kept answers), answer_photos (the photos joined to its
            answers, with what was read off them), state (its current state).
          items:
            type: string
            enum: [answers, answer_photos, state]
          default: []
        prompt:
          type: string
          description: How to answer from the data read — given to the model with it
        skill:
          type: string
          description: |
            A Machine-Readable Skill to run instead, its path relative to the
            type's own directory (and inside it); the question is passed to it
            as {"question": ...} and what it prints is the answer's data.
        attends:
          type: array
          items:
            type: string
          description: |
            What this meets of an irregular moment's needs (a timing's
            requires: reschedule, notify, rebook, retry …), of any type's. One
            nobody hears, the robot proposes asking a want of this type for it.
          example: [reschedule]
      additionalProperties: false

    MonitorCapabilityDef:
      type: object
      description: Describes a capability provided by a MonitorAgent in this want type
      required:
        - capability
      properties:
        capability:
          type: string
          description: Capability identifier string
          example: "temperature_read"
        intervalSeconds:
          type: integer
          description: Default polling interval in seconds (0 = event-driven)
          default: 0
      additionalProperties: false

    # Lifecycle hook definition
    LifecycleHookDef:
      type: object
      description: Actions executed at a want lifecycle event (onInitialize, onDelete, onAchieved)
      properties:
        params:
          type: object
          description: Copy want params into current state (key=stateField, value=paramName)
          additionalProperties:
            type: string
        current:
          type: object
          description: Set current state fields to literal values
          additionalProperties: true
        plan:
          type: object
          description: Set plan state fields to literal values
          additionalProperties: true
        goal:
          type: object
          description: Set goal state fields to literal values
          additionalProperties: true
        mergeParent:
          type: object
          description: |
            Merge fields from the parent want's state into this want's state.
            Key = local state field, value = parent state field to copy from.
          additionalProperties: true
        executeAgents:
          type: boolean
          description: Call ExecuteAgents() after applying state changes
      additionalProperties: false

    # Condition definition
    ConditionDef:
      type: object
      description: Single declarative state condition
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
          description: State field name to evaluate
        operator:
          type: string
          description: Comparison operator
          enum: ["==", "!=", ">", ">=", "<", "<="]
        value:
          description: Value to compare against
      additionalProperties: false

    # Finalize when (groups achieved + failed conditions)
    FinalizeWhen:
      type: object
      description: Declarative termination conditions grouping achieved and failed outcomes.
      properties:
        achieved:
          $ref: '#/components/schemas/ConditionDef'
        failed:
          $ref: '#/components/schemas/ConditionDef'
      additionalProperties: false

    # Inline agent definition
    InlineAgentDef:
      type: object
      description: Executable agent with inline script embedded in a YAML want type
      required: [name, type, runtime]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [think, do, monitor]
        runtime:
          type: string
          enum: [shell, python, rego]
        script:
          type: string
          description: Inline script source
        scriptFile:
          type: string
          description: Path to an external script file (alternative to script)
        interval:
          type: integer
          description: Execution interval in seconds (0 = default)
          default: 0
      additionalProperties: false

    # Agent definition
    AgentDef:
      type: object
      description: Agent integration definition
      required:
        - name
        - role
        - description
      properties:
        name:
          type: string
          description: Agent name
        role:
          type: string
          description: Agent role
          enum:
            - monitor
            - action
            - validator
            - transformer
        description:
          type: string
          description: Agent description
        example:
          type: string
          description: Usage example
      additionalProperties: false

    # Constraint definition
    ConstraintDef:
      type: object
      description: Business logic constraint
      required:
        - description
        - validation
      properties:
        description:
          type: string
          description: Constraint description
        validation:
          type: string
          description: Validation rule
      additionalProperties: false

    # How a want of the type is asked for, in words
    AskDef:
      type: object
      description: |
        One way a person asks for a want of this type, and the parameters it
        is to be made with. What reads requests (the robot, Laya) learns from
        these and is tested on them. Not ExampleDef, which shows a want's YAML.
      required:
        - say
      properties:
        say:
          type: string
          description: |
            What is said. <alias> is the type's name said as any of its
            aliases (its label aliases) — one ask written, one for each alias:
            「中野の<alias>」 is 「中野の天気」 and 「中野のweather」.
          example: 10分後に国分寺から中野坂上
        at:
          type: string
          description: |
            When it was said (HH:MM, or a date and time) — for a request whose
            right answer turns on the time: 「10分後に…」 said at 19:33 is 19:43.
          example: "19:33"
        params:
          type: object
          description: |
            The parameters it is to be made with; one left out is not said.
            A value <home> is the asker's home at that part of the day — a
            place not said, filled with where they go then.
          additionalProperties: true
          example: {from: 国分寺, to: 中野坂上, time: "19:43", arrive_type: 出発}
        variants:
          type: array
          items: {type: string}
          description: |
            The same ask said other ways — the same meaning, at and params.
            What reads requests learns from these; say is what it is tested
            on, so it is tested on words it has not learnt.
          example: ["国分寺から中野坂上まで、10分後に出たい", "10分したら国分寺を出て中野坂上へ"]
      additionalProperties: false

    # Example definition
    ExampleDef:
      type: object
      description: Usage example
      required:
        - name
        - description
        - want
        - expectedBehavior
      properties:
        name:
          type: string
          description: Example name
        description:
          type: string
          description: Example description
        want:
          type: object
          description: Full want configuration
          additionalProperties: true
        expectedBehavior:
          type: string
          description: Expected behavior description
      additionalProperties: false
